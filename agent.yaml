manifest_version: "1.0"
agent_type: wechat-traffic-agent
name: 微信情绪题图 Agent
version: 0.3.0
description: 研究细分人群的已验证选题，生成可直接粘贴到公众号文字海报的题图文案，并根据人工回填数据调整内容策略。
runtime_api: ">=0.3,<1.0"
capabilities:
