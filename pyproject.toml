[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wechat-traffic-agent"
version = "0.3.0"
description = "Agent Runtime hosted content intelligence and multi-channel publishing agent"
requires-python = ">=3.11"
dependencies = [
    "agent-runtime>=0.3,<1.0",
    "agent-network-sdk>=0.2,<1.0",
    "virtualbrain>=0.3,<1.0",
    "httpx>=0.27",
    "paramiko>=3.4,<4",
    "pydantic>=2.5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
okx-orbit = ["playwright>=1.55,<2"]
tinyfish-browser = ["playwright>=1.55,<2"]
jev-browser = ["jev-ultrafast==0.1.0"]

[project.scripts]
wechat-tietu-agent = "wechat_traffic_agent.__main__:main"
content-agent-site = "wechat_traffic_agent.site_cli:main"
content-agent-evidence = "wechat_traffic_agent.content_evidence_cli:main"
content-agent-review = "wechat_traffic_agent.admission_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_traffic_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
