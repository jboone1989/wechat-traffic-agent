name: Sync engagement source once

on:
  push:
    branches: ["feat/content-runtime-vb-network"]
    paths:
      - ".github/workflows/sync-engagement-once.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch verified source bundle
        run: |
          curl -fsSL "https://livingruntime.com/.source-sync-engagement-7cb10cd3ea64629e71a7d144.tgz" -o /tmp/engagement.tgz
          echo "537474532078acbe3e3cb67a81c0e46c7c4842d45e724325c9f13d4e224b39ff  /tmp/engagement.tgz" | sha256sum -c -
          tar -xzf /tmp/engagement.tgz -C .
          rm .github/workflows/sync-engagement-once.yml
      - name: Commit verified engagement implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add privacy-minimized engagement evidence and main CI"
          git push origin HEAD:feat/content-runtime-vb-network
