permissions:
  contents: read
jobs:
  x-social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install "pytest>=8" "pydantic>=2.5" "httpx>=0.27" "pyyaml>=6" "starlette>=0.37" "itsdangerous>=2.2,<3" "websockets>=14,<16" "Pillow>=10,<13"
      - name: Compile X and OKX social boundary
        run: >-
          python -m py_compile
          src/wechat_traffic_agent/x_mcp.py
          src/wechat_traffic_agent/x_social.py
          src/wechat_traffic_agent/x_discovery.py
          src/wechat_traffic_agent/agent_runtime_chatgpt.py
          src/wechat_traffic_agent/editorial_policy.py
          src/wechat_traffic_agent/l1_decisions.py
          src/wechat_traffic_agent/x_growth_mission.py
          src/wechat_traffic_agent/x_goal_progress.py
          src/wechat_traffic_agent/owner_agent_episode.py
          src/wechat_traffic_agent/wakeful_tasks.py
          src/wechat_traffic_agent/x_browser.py
          src/wechat_traffic_agent/local_browser_control.py
          src/wechat_traffic_agent/x_local_browser.py
          src/wechat_traffic_agent/x_jev_social.py
          src/wechat_traffic_agent/x_jev_article.py
          src/wechat_traffic_agent/x_article_media.py
          src/wechat_traffic_agent/x_image_generation.py
          src/wechat_traffic_agent/account_management.py
          src/wechat_traffic_agent/channels/operator_console_page.py
          src/wechat_traffic_agent/x_outcomes.py
          src/wechat_traffic_agent/social_expression.py
          src/wechat_traffic_agent/social_evidence.py
          src/wechat_traffic_agent/social_performance.py
          src/wechat_traffic_agent/okx_orbit.py
          src/wechat_traffic_agent/okx_orbit_outcomes.py
          src/wechat_traffic_agent/sources/runtime_x.py
          src/wechat_traffic_agent/world_feed.py
          src/wechat_traffic_agent/live_agent.py
          src/wechat_traffic_agent/channels/agent_live_page.py
          src/wechat_traffic_agent/channels/agent_home_experience.py
          src/wechat_traffic_agent/channels/agent_web.py
          scripts/run_content_agent.py
          scripts/collect_x_outcomes.py
          scripts/collect_okx_orbit_outcomes.py
      - name: Build lightweight runtime stubs
        run: |
          mkdir -p .x-ci/agent_runtime .x-ci/agent_network
          # Only external Runtime interfaces are substituted. Tests exercise the
          # real Content Agent methods and explicitly replace browser I/O.
          mkdir -p .x-ci/agent_runtime/integrations .x-ci/agent_runtime/llm
          cat > .x-ci/agent_runtime/integrations/__init__.py <<'PY'
          BROWSER_NAVIGATE = "browser.navigate"
          BROWSER_SCREENSHOT = "browser.screenshot"
          class PersistentBrowserTakeoverProvider:
              def __init__(self, **kwargs):
                  pass
              def takeover_status(self, profile_id):
                  from types import SimpleNamespace
                  return SimpleNamespace(browser_running=False, active=False, url=None)
          class BrowserPolicy:
              def __init__(self, **kwargs):
                  self.__dict__.update(kwargs)
          class BrowserHarnessRuntime:
              def __init__(self, **kwargs):
                  self.__dict__.update(kwargs)
          class BrowserHarnessProvider:
              def __init__(self, *, policy, runtime):
                  self.policy, self.runtime = policy, runtime
              def readiness(self):
                  return {"status": "UNAVAILABLE", "reason": "CI has no authenticated browser"}
              def invoke(self, *args, **kwargs):
                  raise RuntimeError("CI browser I/O must be substituted by the test")
          PY
          printf '%s\\n' 'from . import BROWSER_NAVIGATE, BrowserPolicy' > .x-ci/agent_runtime/integrations/browser.py
          printf '%s\\n' 'from . import BrowserHarnessProvider, BrowserHarnessRuntime' > .x-ci/agent_runtime/integrations/browser_harness.py
          cat > .x-ci/agent_runtime/llm/__init__.py <<'PY'
          class ChatGPTBrowserProviderError(RuntimeError):
              pass
          class ChatGPTBrowserProvider:
              @classmethod
              def from_environment(cls):
                  raise ChatGPTBrowserProviderError("CI provider must be substituted by the test")
          PY
          printf '%s\n' '' > .x-ci/agent_runtime/__init__.py
          printf '%s\n' 'class AgentRuntime: pass' > .x-ci/agent_runtime/runtime.py
          printf '%s\n' '' > .x-ci/agent_network/__init__.py
          cat > .x-ci/agent_network/crypto.py <<'PY'
          import hashlib, hmac, json, secrets
          from pathlib import Path

          def _canonical(payload):
              value = dict(payload)
              for key in ("signature", "requester_signature", "executor_signature", "signature_by_old_key", "recovery_signatures", "contract_hash", "object_hash", "event_hash", "evidence_record_hash", "leaf_hashes"):
                  value.pop(key, None)
              return json.dumps(value, sort_keys=True, separators=(",", ":")).encode()

          class Identity:
              def __init__(self, agent_id, secret):
                  self.agent_id = agent_id
                  self._secret = secret
                  self.key_id = hashlib.sha256(secret.encode()).hexdigest()[:16]
                  self.public_key = secret

              @classmethod
              def generate(cls, agent_id):
                  return cls(agent_id, secrets.token_hex(32))

              @classmethod
              def load_or_create(cls, path, agent_id, *, secret_path=None):
                  path = Path(path)
                  if path.exists():
                      row = json.loads(path.read_text())
                      return cls(row["agent_id"], row["secret"])
                  identity = cls.generate(agent_id)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(json.dumps({"agent_id": identity.agent_id, "secret": identity._secret}))
                  return identity

              def sign_object(self, payload):
                  return hmac.new(self._secret.encode(), _canonical(payload), hashlib.sha256).hexdigest()

              def object_hash(self, payload):
                  return "sha256:" + hashlib.sha256(_canonical(payload)).hexdigest()

          def verify_object(public_key, payload, signature):
              expected = hmac.new(str(public_key).encode(), _canonical(payload), hashlib.sha256).hexdigest()
              return hmac.compare_digest(expected, str(signature))
          PY
      - name: Run X and OKX social regressions
        env:
          PYTHONPATH: .x-ci:src
        run: >-
          python -m pytest -q -c /dev/null
          tests/test_x_mcp.py tests/test_x_social.py tests/test_x_browser.py tests/test_account_management.py tests/test_agent_runtime_browser_path.py tests/test_operator_console.py tests/test_x_outcomes.py tests/test_x_site.py
          tests/test_x_article_media.py tests/test_x_transport_transactions.py tests/test_x_owner_progress.py
          tests/test_x_discovery.py tests/test_l1_decisions.py tests/test_agent_runtime_chatgpt_format.py
          tests/test_x_jev_social_native.py tests/test_x_jev_transaction_native.py tests/test_x_growth_loop_native.py
          tests/test_social_expression.py tests/test_social_performance.py
          tests/test_okx_orbit.py tests/test_okx_orbit_outcomes.py
          tests/test_world_feed.py tests/test_live_agent.py
          tests/test_run_content_agent_entrypoint.py
