name: Content Runtime Network

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "pyproject.toml"
      - "agent.yaml"
      - "src/wechat_traffic_agent/runtime_app.py"
      - "src/wechat_traffic_agent/runtime_backend.py"
      - "src/wechat_traffic_agent/network_service.py"
      - "src/wechat_traffic_agent/content_artifact.py"
      - "src/wechat_traffic_agent/web_editorial.py"
      - "src/wechat_traffic_agent/content_loop.py"
      - "src/wechat_traffic_agent/content_goal_loop.py"
      - "src/wechat_traffic_agent/content_explorer.py"
      - "src/wechat_traffic_agent/content_mind.py"
      - "src/wechat_traffic_agent/world_feed.py"
      - "src/wechat_traffic_agent/prospective_predictions.py"
      - "src/wechat_traffic_agent/evidence_floor.py"
      - "src/wechat_traffic_agent/sources/runtime_web.py"
      - "src/wechat_traffic_agent/live_agent.py"
      - "src/wechat_traffic_agent/memory_*.py"
      - "tests/test_memory_*.py"
      - "docs/MEMORY_SYSTEM_ROADMAP.md"
      - "docs/adr/0011-ferro-memory-system.md"
      - "src/wechat_traffic_agent/wakeful_runtime.py"
      - "src/wechat_traffic_agent/wakeful_tasks.py"
      - "src/wechat_traffic_agent/developmental_agency.py"
      - "src/wechat_traffic_agent/developmental_transfer.py"
      - "src/wechat_traffic_agent/neural_dreaming.py"
      - "src/wechat_traffic_agent/neural_extensions.py"
      - "src/wechat_traffic_agent/cortex_continuity.py"
      - "src/wechat_traffic_agent/neural_organ_handoff.py"
      - "src/wechat_traffic_agent/longitudinal_individuality.py"
      - "src/wechat_traffic_agent/open_ended_evolution.py"
      - "src/wechat_traffic_agent/open_development_acceptance.py"
      - "tests/test_developmental_agency.py"
      - "tests/test_developmental_transfer.py"
      - "tests/test_dream_consolidation.py"
      - "tests/test_neural_extensions.py"
      - "tests/test_cortex_continuity.py"
      - "tests/test_neural_organ_handoff.py"
      - "tests/test_longitudinal_individuality.py"
      - "tests/test_open_ended_evolution.py"
      - "tests/test_open_development_acceptance.py"
      - "src/wechat_traffic_agent/resource_scout.py"
      - "src/wechat_traffic_agent/channels/agent_live_page.py"
      - "src/wechat_traffic_agent/channels/operator_audience_page.py"
      - "src/wechat_traffic_agent/audience_analytics.py"
      - "tests/test_audience_analytics.py"
      - "src/wechat_traffic_agent/automatic_website.py"
      - "src/wechat_traffic_agent/website_experiment.py"
      - "src/wechat_traffic_agent/website_experiment_evaluation.py"
      - "content/learning/**"
      - "tests/test_content_loop.py"
      - "tests/test_content_explorer.py"
      - "tests/test_content_explorer_loop.py"
      - "tests/test_goal_web_search.py"
      - "tests/test_content_mind.py"
      - "tests/test_world_feed.py"
      - "tests/test_prospective_predictions.py"
      - "tests/test_evidence_floor.py"
      - "tests/test_evidence_floor_goal_loop.py"
      - "tests/test_live_agent.py"
      - "src/wechat_traffic_agent/channel_evidence.py"
      - "src/wechat_traffic_agent/content_evidence_cli.py"
      - "tests/test_web_editorial.py"
      - "tests/test_channel_evidence.py"
      - "tests/test_website_experiment.py"
      - "src/wechat_traffic_agent/content_admission.py"
      - "src/wechat_traffic_agent/admission_cli.py"
      - "tests/test_content_admission.py"
      - "src/wechat_traffic_agent/content_service.py"
      - "src/wechat_traffic_agent/draft_inbox.py"
      - "src/wechat_traffic_agent/trading_draft_worker.py"
      - "src/wechat_traffic_agent/sources/__init__.py"
      - "src/wechat_traffic_agent/sources/contracts.py"
      - "src/wechat_traffic_agent/sources/trading_network.py"
      - "src/wechat_traffic_agent/sources/runtime_web.py"
      - "scripts/run_content_agent.py"
      - "tests/test_content_runtime_app.py"
      - "tests/test_runtime_backend.py"
      - "tests/test_content_network_service.py"
      - "tests/test_content_runtime_dependencies.py"
      - "tests/test_run_content_agent_entrypoint.py"
      - "tests/test_wakeful_runtime.py"
      - "tests/test_content_resource_scout.py"
      - "tests/test_trading_network_source.py"
      - "tests/test_draft_inbox.py"
      - "tests/test_trading_draft_worker.py"
      - ".github/workflows/content-runtime-network.yml"

permissions:
  contents: read

jobs:
  runtime-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependency
        run: python -m pip install "pytest>=8" "pydantic>=2.5" "httpx>=0.27" "pyyaml>=6" "starlette>=0.37" "uvicorn>=0.30" "websockets>=14,<16"
      - name: Build isolated Memory System package
        run: |
          mkdir -p .memory-ci/wechat_traffic_agent
          printf '%s\n' '"""Isolated Ferro Memory System tests."""' > .memory-ci/wechat_traffic_agent/__init__.py
          cp src/wechat_traffic_agent/memory_*.py .memory-ci/wechat_traffic_agent/
          cp src/wechat_traffic_agent/operator_memory.py .memory-ci/wechat_traffic_agent/
      - name: Run Ferro Memory System regressions
        env:
          PYTHONPATH: .memory-ci
        run: >-
          python -m pytest -q -c /dev/null
          tests/test_memory_system.py
          tests/test_memory_formation.py
          tests/test_memory_retrieval.py
          tests/test_memory_episode.py
          tests/test_memory_semantic.py
          tests/test_memory_procedural.py
          tests/test_memory_vector.py
          tests/test_memory_consolidation.py
          tests/test_memory_consolidation_revision.py
          tests/test_memory_runtime.py
          tests/test_memory_life.py
          tests/test_memory_observation.py
          tests/test_memory_prior.py
          tests/test_memory_salience.py
          tests/test_memory_self.py
          tests/test_memory_continuity.py
          tests/test_memory_evolution.py
          tests/test_operator_memory.py
          tests/test_operator_memory_admission.py
      - name: Compile goal/mind boundary
        run: >-
          python -m py_compile
          src/wechat_traffic_agent/content_mind.py
          src/wechat_traffic_agent/content_explorer.py
          src/wechat_traffic_agent/content_goal_loop.py
          src/wechat_traffic_agent/world_feed.py
          src/wechat_traffic_agent/prospective_predictions.py
          src/wechat_traffic_agent/evidence_floor.py
          src/wechat_traffic_agent/live_agent.py
          src/wechat_traffic_agent/wakeful_runtime.py
          src/wechat_traffic_agent/wakeful_tasks.py
          src/wechat_traffic_agent/developmental_agency.py
          src/wechat_traffic_agent/developmental_transfer.py
          src/wechat_traffic_agent/neural_dreaming.py
          src/wechat_traffic_agent/neural_extensions.py
          src/wechat_traffic_agent/cortex_continuity.py
          src/wechat_traffic_agent/neural_organ_handoff.py
          src/wechat_traffic_agent/longitudinal_individuality.py
          src/wechat_traffic_agent/open_ended_evolution.py
          src/wechat_traffic_agent/open_development_acceptance.py
          src/wechat_traffic_agent/resource_scout.py
          src/wechat_traffic_agent/channels/agent_live_page.py
          src/wechat_traffic_agent/channels/operator_audience_page.py
          src/wechat_traffic_agent/audience_analytics.py
          src/wechat_traffic_agent/website_experiment.py
          src/wechat_traffic_agent/website_experiment_evaluation.py
          src/wechat_traffic_agent/sources/runtime_web.py
      - name: Build isolated runtime package
        run: |
          mkdir -p .runtime-ci/wechat_traffic_agent
          printf '%s\n' '"""Isolated persistent Content Agent tests."""' > .runtime-ci/wechat_traffic_agent/__init__.py
          cp src/wechat_traffic_agent/runtime_app.py .runtime-ci/wechat_traffic_agent/
          cp src/wechat_traffic_agent/network_capabilities.py .runtime-ci/wechat_traffic_agent/
          cp src/wechat_traffic_agent/runtime_backend.py .runtime-ci/wechat_traffic_agent/
          cp src/wechat_traffic_agent/network_service.py .runtime-ci/wechat_traffic_agent/
          cp src/wechat_traffic_agent/public_persona.py .runtime-ci/wechat_traffic_agent/
      - name: Build isolated Trading source package
        run: |
          mkdir -p .source-ci/wechat_traffic_agent/sources
          printf '%s\n' '"""Isolated Trading source tests."""' > .source-ci/wechat_traffic_agent/__init__.py
          printf '%s\n' '"""Isolated source package."""' > .source-ci/wechat_traffic_agent/sources/__init__.py
          cp src/wechat_traffic_agent/models.py .source-ci/wechat_traffic_agent/
          cp src/wechat_traffic_agent/sources/trading_network.py .source-ci/wechat_traffic_agent/sources/
      - name: Build isolated draft-worker package
        run: |
          mkdir -p .draft-ci/wechat_traffic_agent/sources .draft-ci/agent_runtime
          printf '%s\n' '"""Isolated draft worker tests."""' > .draft-ci/wechat_traffic_agent/__init__.py
          printf '%s\n' '"""Isolated source package."""' > .draft-ci/wechat_traffic_agent/sources/__init__.py
          printf '%s\n' '"""Test stub."""' > .draft-ci/agent_runtime/__init__.py
          printf '%s\n' 'class AgentRuntime: pass' > .draft-ci/agent_runtime/runtime.py
          cp src/wechat_traffic_agent/content_artifact.py .draft-ci/wechat_traffic_agent/
          cp src/wechat_traffic_agent/content_service.py .draft-ci/wechat_traffic_agent/
          cp src/wechat_traffic_agent/draft_inbox.py .draft-ci/wechat_traffic_agent/
          cp src/wechat_traffic_agent/models.py .draft-ci/wechat_traffic_agent/
          cp src/wechat_traffic_agent/trading_draft_worker.py .draft-ci/wechat_traffic_agent/
          cp src/wechat_traffic_agent/sources/trading_network.py .draft-ci/wechat_traffic_agent/sources/
      - name: Run persistent application boundary tests
        env:
          PYTHONPATH: .runtime-ci
        run: >-
          python -m pytest -q -c /dev/null
          tests/test_content_runtime_app.py
          tests/test_runtime_backend.py
          tests/test_content_network_service.py
          tests/test_content_runtime_dependencies.py
          tests/test_run_content_agent_entrypoint.py
      - name: Run Trading Network source regression
        env:
          PYTHONPATH: .source-ci
        run: python -m pytest -q -c /dev/null tests/test_trading_network_source.py
      - name: Run immutable draft worker regression
        env:
          PYTHONPATH: .draft-ci
        run: python -m pytest -q -c /dev/null tests/test_draft_inbox.py tests/test_trading_draft_worker.py
      - name: Build isolated editorial and channel evidence package
        run: |
          mkdir -p .editorial-ci/agent_runtime
          cp -r src/wechat_traffic_agent .editorial-ci/
          printf '%s\n' '' > .editorial-ci/wechat_traffic_agent/__init__.py
          printf '%s\n' '' > .editorial-ci/agent_runtime/__init__.py
          printf '%s\n' 'class AgentRuntime: pass' > .editorial-ci/agent_runtime/runtime.py
      - name: Run Website editorial and scoped feedback regressions
        env:
          PYTHONPATH: .editorial-ci
        run: >-
          python -m pytest -q -c /dev/null
          tests/test_web_editorial.py tests/test_channel_evidence.py tests/test_website_experiment.py
          tests/test_content_loop.py tests/test_content_explorer.py tests/test_content_explorer_loop.py tests/test_goal_web_search.py
          tests/test_content_strategy_context.py
          tests/test_world_feed.py tests/test_prospective_predictions.py
          tests/test_evidence_floor.py tests/test_evidence_floor_goal_loop.py tests/test_live_agent.py
      - name: Run Ferro open-development state-machine regressions
        env:
          PYTHONPATH: .editorial-ci
        run: >-
          python -m pytest -q -c /dev/null
          tests/test_developmental_agency.py
          tests/test_developmental_transfer.py
          tests/test_cortex_continuity.py
          tests/test_neural_organ_handoff.py
          tests/test_longitudinal_individuality.py
          tests/test_open_ended_evolution.py
          tests/test_open_development_acceptance.py
      - name: Build source bundle
        run: tar --exclude=.git --exclude=.runtime-ci --exclude=.source-ci --exclude=.draft-ci --exclude=.editorial-ci --exclude=state --exclude=output -czf "$RUNNER_TEMP/content-agent-runtime-release.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: content-agent-runtime-release
          path: ${{ runner.temp }}/content-agent-runtime-release.tgz
          if-no-files-found: error
