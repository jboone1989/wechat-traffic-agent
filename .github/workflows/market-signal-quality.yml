name: Market Signals (isolated)
on:
  pull_request:
    paths:
      - 'src/wechat_traffic_agent/sources/market_*.py'
      - 'market_tests/**'
      - '.github/workflows/market-signal-quality.yml'
  push:
    paths:
      - 'src/wechat_traffic_agent/sources/market_*.py'
      - 'market_tests/**'
      - '.github/workflows/market-signal-quality.yml'

jobs:
  market-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-only test tools
        run: python -m pip install httpx pytest
      - name: Compile read-only source modules
        run: python -m compileall -q src/wechat_traffic_agent/sources/market_*.py scripts/run_market_signals_worker.py
      - name: Test independent source contracts
        run: python -m pytest -q market_tests/test_sources.py
