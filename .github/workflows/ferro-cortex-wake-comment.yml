name: Ferro cortex wake comment bridge

on:
  push:
    branches:
      - livingruntime/ferro-cortex-wake

permissions:
  contents: read
  issues: write

jobs:
  ring-cortex:
    runs-on: ubuntu-latest
    steps:
      - name: Publish bounded cortex wake comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: "269"
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          api_base="https://api.github.com/repos/${REPO}"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          accept_header="Accept: application/vnd.github+json"

          marker_payload="$(
            curl -fsSL \
              -H "${auth_header}" \
              -H "${accept_header}" \
              "${api_base}/contents/FERRO_CORTEX_WAKE.json?ref=${HEAD_SHA}"
          )"

          marker="$(
            python3 -c '
import base64, json, sys
payload = json.load(sys.stdin)
content = payload.get("content")
if not isinstance(content, str):
    raise SystemExit("wake marker content missing")
sys.stdout.write(base64.b64decode(content).decode("utf-8"))
' <<<"${marker_payload}"
          )"

          request_id="$(
            python3 -c '
import json, re, sys
marker = json.load(sys.stdin)
if marker.get("schema_version") != "livingruntime-cortex-wake.v1":
    raise SystemExit("unexpected wake schema")
if marker.get("event") != "FERRO_CORTEX_WAKE":
    raise SystemExit("unexpected wake event")
if marker.get("agent_id") != "ferro":
    raise SystemExit("unexpected wake agent")
request_id = str(marker.get("request_id") or "")
if not re.fullmatch(r"llmreq_[A-Za-z0-9._-]{1,120}", request_id):
    raise SystemExit("invalid request_id")
sys.stdout.write(request_id)
' <<<"${marker}"
          )"

          comments="$(
            curl -fsSL \
              -H "${auth_header}" \
              -H "${accept_header}" \
              "${api_base}/issues/${PR_NUMBER}/comments?per_page=100"
          )"

          if python3 -c '
import json, os, sys
comments = json.load(sys.stdin)
needle = "wake_commit=" + os.environ["HEAD_SHA"]
raise SystemExit(0 if any(needle in str(row.get("body") or "") for row in comments) else 1)
' <<<"${comments}"
          then
            echo "Wake comment already exists for ${HEAD_SHA}"
            exit 0
          fi

          comment="$(
            printf '%s\n' \
              'FERRO_CORTEX_WAKE' \
              'agent_id=ferro' \
              "request_id=${request_id}" \
              'source=github-action-comment-bridge' \
              "wake_commit=${HEAD_SHA}" \
              '' \
              'Activation only. Authoritative cognition content remains in LivingRuntime.'
          )"

          body="$(
            python3 -c '
import json, sys
print(json.dumps({"body": sys.stdin.read()}))
' <<<"${comment}"
          )"

          curl -fsSL \
            -X POST \
            -H "${auth_header}" \
            -H "${accept_header}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "${body}" \
            "${api_base}/issues/${PR_NUMBER}/comments" >/dev/null
