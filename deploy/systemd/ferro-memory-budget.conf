# Proposed host-level drop-in for content-agent.service.
# Not installed by writing this file. Review and apply using authorized
# systemd administration. Limits act on the *service cgroup* only;
# ferro-neural is launched as a separate user scope.
[Service]
MemoryAccounting=true
MemoryHigh=1280M
MemoryMax=1536M
MemorySwapMax=256M
